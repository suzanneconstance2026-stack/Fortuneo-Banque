<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaBank Demo - Espace Client</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ÉCRAN DE CONNEXION -->
    <section id="login-screen" class="login-screen">

        <div class="login-card">

            <div class="brand">
                <h1>NovaBank</h1>
                <p>Application de démonstration</p>
            </div>

            <h2>Connexion</h2>

            <div class="form-group">
                <label for="username">
                    Identifiant
                </label>

                <input 
                    id="username"
                    type="text"
                    placeholder="Votre identifiant"
                    autocomplete="username"
                >
            </div>


            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <input 
                    id="password"
                    type="password"
                    placeholder="Votre mot de passe"
                    autocomplete="current-password"
                >

            </div>


            <label class="checkbox">

                <input 
                    type="checkbox"
                    id="remember"
                >

                <span>
                    Mémoriser l'identifiant
                </span>

            </label>


            <button 
                id="login-button"
                class="primary-button"
            >
                Se connecter
            </button>


            <p 
                id="login-message"
                class="message"
            ></p>


        </div>

    </section>




    <!-- APPLICATION PRINCIPALE -->

    <section 
        id="app-screen"
        class="dashboard"
        hidden
    >


        <!-- HEADER -->

        <header class="top-header">

            <div class="profile">

                <div class="avatar">
                    NG
                </div>


                <div>

                    <strong>
                        Nicolas Garnier
                    </strong>

                    <small>
                        Client Premium Démo
                    </small>

                </div>

            </div>



            <button 
                id="logout-button"
                class="secondary-button"
            >
                Déconnexion
            </button>


        </header>





        <!-- CONTENU PRINCIPAL -->

        <main class="content">


            <!-- ACCUEIL -->

            <section 
                id="home-page"
                class="page active"
            >


                <h2>
                    Tableau de bord
                </h2>



                <div class="balance-card">

                    <span>
                        Solde disponible
                    </span>


                    <h3 id="main-balance">
                        0,00 €
                    </h3>


                    <p>
                        Compte principal de démonstration
                    </p>


                </div>




                <div class="quick-actions">


                    <button 
                        class="action-button"
                        data-page="transfer-page"
                    >
                        Effectuer une opération
                    </button>


                    <button 
                        class="action-button"
                        data-page="history-page"
                    >
                        Voir l'historique
                    </button>


                </div>



                <div class="card-section">

                    <h3>
                        Dernières opérations
                    </h3>


                    <div id="recent-transactions">

                    </div>


                </div>


            </section> 
                        <!-- PAGE OPERATIONS -->

            <section 
                id="transfer-page"
                class="page"
            >

                <h2>
                    Nouvelle opération
                </h2>


                <div class="panel">

                    <div class="form-group">

                        <label for="operation-name">
                            Libellé
                        </label>

                        <input 
                            id="operation-name"
                            type="text"
                            placeholder="Exemple : Paiement"
                        >

                    </div>



                    <div class="form-group">

                        <label for="operation-amount">
                            Montant
                        </label>

                        <input 
                            id="operation-amount"
                            type="number"
                            placeholder="0,00"
                        >

                    </div>



                    <div class="form-group">

                        <label for="operation-category">
                            Catégorie
                        </label>


                        <select id="operation-category">

                            <option value="Autre">
                                Autre
                            </option>

                            <option value="Alimentation">
                                Alimentation
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Loisirs">
                                Loisirs
                            </option>

                        </select>


                    </div>



                    <button 
                        id="add-operation"
                        class="primary-button"
                    >
                        Ajouter l'opération
                    </button>


                </div>


            </section>






            <!-- HISTORIQUE -->

            <section 
                id="history-page"
                class="page"
            >

                <h2>
                    Historique
                </h2>


                <div class="panel">


                    <input 
                        id="search-history"
                        type="search"
                        placeholder="Rechercher une opération..."
                    >



                    <div 
                        id="all-transactions"
                        class="transaction-list"
                    >

                    </div>


                </div>


            </section>








            <!-- PROFIL -->

            <section 
                id="profile-page"
                class="page"
            >

                <h2>
                    Profil
                </h2>



                <div class="panel profile-card">


                    <div class="profile-line">

                        <span>
                            Nom
                        </span>

                        <strong>
                            Nicolas Garnier
                        </strong>

                    </div>



                    <div class="profile-line">

                        <span>
                            Type de compte
                        </span>

                        <strong>
                            Démonstration
                        </strong>

                    </div>




                    <div class="profile-line">

                        <span>
                            Statut
                        </span>

                        <strong class="status-online">
                            Actif
                        </strong>

                    </div>



                </div>


            </section>





        </main>





        <!-- NAVIGATION BASSE -->

        <nav class="bottom-navigation">


            <button 
                class="nav-button active"
                data-page="home-page"
            >

                <span>
                    🏠
                </span>

                Accueil

            </button>





            <button 
                class="nav-button"
                data-page="transfer-page"
            >

                <span>
                    ➕
                </span>

                Opération

            </button>





            <button 
                class="nav-button"
                data-page="history-page"
            >

                <span>
                    📄
                </span>

                Historique

            </button>





            <button 
                class="nav-button"
                data-page="profile-page"
            >

                <span>
                    👤
                </span>

                Profil

            </button>



        </nav>



    </section>



</div>



<script src="script.js"></script>

</body>

</html>
