<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortuneo Banque - Espace Privé Haute Richesse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- INTERFACE DE CONNEXION -->
    <div class="login-wrapper" id="login-screen">
        <div class="left-banner"></div>
        <div class="right-form-container">
            <div class="form-box">
                <h2 class="brand-logo-text">fortuneo <span>banque</span></h2>
                <div class="input-group"><input type="text" id="username" placeholder="Identifiant"></div>
                <div class="input-group"><input type="password" id="password" placeholder="Mot de passe"></div>
                <button class="btn-connexion" onclick="login()">Connexion</button>
            </div>
        </div>
    </div>
    <!-- INTERFACE APPLICATIVE -->
    <div class="app-container" id="app-screen" style="display: none;">
        <header class="app-header">Espace Gestion Privée - M. Edmond Garnier</header>
        <div class="alert-blocked-bar"><strong>COMPTE BLOQUÉ</strong></div>
        <main class="app-main">
            <div id="home-section" class="app-section active-section">
                <div class="premium-card">7 585 024,00 €</div>
            </div>
            <div id="transfer-section" class="app-section">
                <div id="form-container">...</div>
                <div id="loader-container" class="loader-box" style="display: none;"></div>
            </div>
        </main>
        <script src="script.js"></script>
    </div>
</body>
</html>
