<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaBank - Espace Client</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<div class="app-container">


    <!-- =========================
         CONNEXION
    ========================== -->

    <section id="login-screen" class="login-screen">


        <div class="login-box">


            <div class="logo">

                <h1>
                    NovaBank
                </h1>

                <p>
                    Espace client
                </p>

            </div>



            <h2>
                Connexion
            </h2>



            <div class="input-group">

                <label>
                    Identifiant
                </label>

                <input 
                    id="username"
                    type="text"
                    placeholder="Votre identifiant"
                >

            </div>




            <div class="input-group">

                <label>
                    Mot de passe
                </label>

                <input 
                    id="password"
                    type="password"
                    placeholder="Votre mot de passe"
                >

            </div>



            <div class="remember">

                <input 
                    id="remember"
                    type="checkbox"
                >

                <label for="remember">
                    Se souvenir de moi
                </label>

            </div>



            <button 
                id="login-btn"
                class="main-btn"
            >
                Se connecter
            </button>



            <p 
                id="login-error"
                class="error-message"
            ></p>



        </div>


    </section>







    <!-- =========================
         APPLICATION
    ========================== -->


    <section 
        id="bank-app"
        class="bank-app"
        hidden
    >



        <!-- HEADER -->

        <header class="header">


            <div class="user-info">


                <div class="avatar">
                    NG
                </div>


                <div>

                    <strong>
                        Nicolas Garnier
                    </strong>

                    <span>
                        Client Premium
                    </span>

                </div>


            </div>




            <button 
                id="logout-btn"
                class="logout"
            >
                Sortir
            </button>


        </header>





        <!-- CONTENU -->

        <main class="main-content">



            <!-- PAGE ACCUEIL -->

            <section 
                id="dashboard"
                class="page active"
            >


                <h2>
                    Vue d'ensemble
                </h2>




                <div class="balance-card">


                    <p>
                        Solde disponible
                    </p>


                    <h1 id="balance">
                        0,00 €
                    </h1>


                    <small>
                        Compte principal
                    </small>


                </div>





                <div class="quick-menu">


                    <button data-page="operations">
                        Nouvelle opération
                    </button>


                    <button data-page="transactions">
                        Historique
                    </button>


                    <button data-page="cards">
                        Mes cartes
                    </button>


                </div>





                <div class="section-card">


                    <h3>
                        Dernières activités
                    </h3>



                    <div id="recent-list">

                    </div>


                </div>



            </section>
