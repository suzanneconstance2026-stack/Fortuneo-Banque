<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Fortuneo Banque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- L'ÉCRAN DE CONNEXION PRINCIPAL REPRODUIT -->
    <div class="login-wrapper" id="login-screen">
        <!-- Colonne Gauche : Image et message de bienvenue -->
        <div class="left-banner">
            <div class="banner-content">
                <img src="https://fortuneo.fr" alt="Fortuneo" class="white-logo" onerror="this.src='https://wikimedia.org'">
                <h1>Bienvenue<br>dans votre<br>espace client.</h1>
            </div>
        </div>

        <!-- Colonne Droite : Formulaire officiel -->
        <div class="right-form-container">
            <div class="form-box">
                <img src="https://wikimedia.org" alt="Fortuneo Banque" class="main-logo">
                <h2>Saisissez votre identifiant et mot de passe</h2>
                
                <div class="input-group">
                    <label for="username">Identifiant</label>
                    <input type="text" id="username" placeholder="000000">
                </div>
                
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••••••">
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Mémoriser l'identifiant</label>
                </div>

                <button class="btn-connexion" onclick="login()">Connexion</button>
            </div>
        </div>
    </div>

    <!-- LE TABLEAU DE BORD (Masqué par défaut) -->
    <div class="dashboard" id="dashboard-screen" style="display: none;">
        <header>
            <img src="https://wikimedia.org" alt="Fortuneo" style="height: 40px;">
            <button onclick="logout()" class="logout-btn">Se déconnecter</button>
        </header>
        <section class="balance-card">
            <h3>Solde disponible</h3>
            <div class="amount" id="balance">0,00 €</div>
            <small>Compte Courant N° FR76 3000 1000 ...</small>
        </section>
        <section class="transfer-box">
            <h3>Faire un virement simulation</h3>
            <input type="text" id="beneficiary" placeholder="Nom du bénéficiaire">
            <input type="number" id="amount-input" placeholder="Montant en €">
            <button onclick="executeTransfer()">Valider le virement</button>
        </section>
        <section class="history">
            <h3>Dernières opérations</h3>
            <ul id="transactions-list">
                <li><span>Virement reçu (Salaire)</span> <span class="positive">+2 200,00 €</span></li>
                <li><span>Paiement Supermarché</span> <span class="negative">-85,50 €</span></li>
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
